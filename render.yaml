# Render blueprint — `git push` after connecting this repo to Render and
# the web service comes up.
#
# Database is on Neon (since 2026-06-22) — the `databases:` block below is
# kept for blueprint completeness but is no longer the source of truth.
# `DATABASE_URL` in the Render dashboard is set manually to the Neon
# connection string and takes precedence over the fromDatabase injection.
#
# Branch: Render's dashboard branch setting drives auto-deploy. Set it to
# your working branch (e.g. feat/mobile-scaffold) in
# Settings → Build & Deploy → Branch. Otherwise Render defaults to `main`
# and silently deploys stale code.
#
# Free tier caveats:
#   • web service sleeps after 15 min of inactivity (~30s cold-start on wake)
#   • outbound SMTP blocked (moot — email now via Resend HTTPS)
#
# When stakeholders sign off, change web `plan: free` → `plan: starter`
# ($7/mo) and the sleep disappears. See claude.md for upgrade notes.

services:
  - type: web
    name: tazkirati-web
    runtime: docker
    region: frankfurt        # closest to Sudan among Render regions
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tazkirati-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false           # set manually to your deployed origin
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_POOL_MAX_OVERFLOW
        value: "10"
      # Admin creds — set in Render dashboard so prod admin can be rotated
      # without a code change. seed.py falls back to committed defaults if
      # these are unset (fine for local dev).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Resend HTTP API — set these manually in the Render dashboard.
      # sync:false keeps the key + sender out of source control.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

databases:
  - name: tazkirati-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 15
